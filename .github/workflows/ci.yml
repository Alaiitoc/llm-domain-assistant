name: CI

on:
  push:
    # develop is the working branch; badge + gates cover it.
    # Keep `main` for the merged trunk; prune `develop` once PR flow takes over.
    branches: [main, develop]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest

  # eval-gate:
  #   TODO: enable once the golden set and baseline scorecard exist.
  #   Spin up Qdrant (services.qdrant from docker-compose.yml), ingest the corpus,
  #   run `python -m eval.run_eval --config configs/eval.yaml --gate`,
  #   and upload the scorecard as a CI artifact. A metric below any gate fails the PR.
