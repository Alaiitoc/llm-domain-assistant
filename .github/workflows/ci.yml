name: CI

on:
  push:
    # Trunk only: feature work flows through PRs, which fire the pull_request
    # trigger below — a push trigger on develop would just duplicate runs.
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest

  # eval-gate:
  #   TODO: enable once the golden set and baseline scorecard exist.
  #   Spin up Qdrant (services.qdrant from docker-compose.yml), ingest the corpus,
  #   run `python -m eval.run_eval --config configs/eval.yaml --gate`,
  #   and upload the scorecard as a CI artifact. A metric below any gate fails the PR.
